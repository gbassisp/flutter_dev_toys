name: flutter_dev_toys
description: A collection of simple dev tools inspired by Dev Toys.
version: 1.0.2+3
publish_to: none


environment:
  sdk: ">=3.2.3 <4.0.0"
  flutter: ">=3.16.3 <4.0.0"

dependencies:
  archive: ^4.0.7
  collection: ^1.18.0
  crypto: ^3.0.3
  desktop_drop: ^0.6.1
  easy_debounce: ^2.0.3
  english_numerals: ^1.0.1
  file_picker: ^10.2.3
  file_saver: ^0.3.1
  flex_color_scheme: ^8.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.1.3
  image_picker: ^1.0.5
  intl: ^0.20.2
  lean_extensions: ^1.1.0
  path_provider: ^2.1.1
  pretty_qr_code: ^3.0.0
  provider: ^6.1.2
  share_plus: ^11.0.0
  url_launcher: ^6.2.2
  uuid: ^4.3.3
  widgets_to_image: ^2.0.1

dev_dependencies:
  # boolean_lints: ^2.0.0
  build_runner: ^2.5.4
  # custom_lint: ^0.5.11
  flutter_gen_runner: ^5.3.2
  # flutter_sane_lints: ^0.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.2
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
